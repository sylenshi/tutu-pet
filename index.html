<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; user-select: none; -webkit-user-drag: none; }
  html, body {
    background: transparent;
    overflow: hidden;
    width: 100%;
    height: 100%;
    cursor: grab;
  }
  body:active { cursor: grabbing; }

  /* 布局：上方 58% 是气泡专区，下方 42% 是角色区 */
  #bubble-zone {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 58%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    pointer-events: none; /* 气泡区鼠标穿透，不挡其他窗口操作 */
  }
  #pet-zone {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%;
    height: 42%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  #pet-img {
    max-height: 98%;
    max-width: 98%;
    width: auto;
    object-fit: contain;
    transform-origin: bottom center;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.35));
  }

  /* ===== 动画定义 ===== */
  @keyframes idle-breathe {
    0%, 100% { transform: scale(1) translateY(0); }
    50% { transform: scale(1.015) translateY(-3px); }
  }
  @keyframes bounce-click {
    0% { transform: scale(1) translateY(0); }
    30% { transform: scale(0.92, 1.06) translateY(4px); }
    55% { transform: scale(1.08, 0.92) translateY(-18px); }
    75% { transform: scale(0.98, 1.03) translateY(0); }
    100% { transform: scale(1) translateY(0); }
  }
  @keyframes wiggle-drag {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-6deg) scale(1.03); }
    75% { transform: rotate(6deg) scale(1.03); }
  }
  @keyframes wave-hello {
    0% { transform: translateY(30px) scale(0.9); opacity: 0; }
    60% { transform: translateY(-8px) scale(1.04); opacity: 1; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  @keyframes secret-pop {
    0% { transform: scale(0.6) rotate(-8deg); opacity: 0; }
    55% { transform: scale(1.12) rotate(4deg); opacity: 1; }
    80% { transform: scale(0.96) rotate(-2deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  .anim-idle { animation: idle-breathe 3.2s ease-in-out infinite; }
  .anim-click { animation: bounce-click 0.65s cubic-bezier(0.34, 1.2, 0.64, 1); }
  .anim-drag { animation: wiggle-drag 0.5s ease-in-out infinite; }
  .anim-hello { animation: wave-hello 0.8s cubic-bezier(0.34, 1.3, 0.64, 1); }
  .anim-secret { animation: secret-pop 0.9s cubic-bezier(0.34, 1.3, 0.64, 1); }

  /* ===== 气泡（在气泡区内，不会被窗口截断）===== */
  #bubble {
    position: relative;
    margin-bottom: 8px;
    background: rgba(255, 255, 255, 0.97);
    border-radius: 16px;
    padding: 12px 16px;
    max-width: 260px;
    min-width: 120px;
    opacity: 0;
    transform: translateY(16px) scale(0.85);
    pointer-events: none;
    transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.34, 1.4, 0.64, 1);
    box-shadow: 0 6px 20px rgba(0,0,0,0.22);
    z-index: 10;
  }
  #bubble.show {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  #bubble::after {
    content: '';
    position: absolute;
    bottom: -9px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-top: 10px solid rgba(255,255,255,0.97);
  }
  #bubble-text {
    font-family: "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.55;
    color: #333;
    word-break: break-word;
  }
  #bubble-title {
    font-family: "Microsoft YaHei", sans-serif;
    font-size: 12px;
    color: #999;
    margin-bottom: 4px;
  }
</style>
</head>
<body>
  <div id="bubble-zone">
    <div id="bubble">
      <div id="bubble-title"></div>
      <div id="bubble-text"></div>
    </div>
  </div>
  <div id="pet-zone">
    <img id="pet-img" src="assets/transparent/idle_sit.png" draggable="false">
  </div>
  <script src="renderer.js"></script>
</body>
</html>

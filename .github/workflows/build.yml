name: Build

# 触发方式：
#   1. 推送 v 开头的 tag（如 v1.0.0）—— 构建并生成 Release 草稿
#   2. 在 Actions 页面手动触发（workflow_dispatch）—— 只构建，产物存为 Artifact
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    name: Windows 便携版
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: 构建 Windows 便携版 exe
        run: npx electron-builder --win portable
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist/*.exe
          if-no-files-found: error

  build-mac:
    name: macOS dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: 构建 macOS dmg + zip（x64 与 arm64）
        run: npx electron-builder --mac --x64 --arm64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: dist/*.zip
          if-no-files-found: error

  build-linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: 构建 Linux AppImage
        run: npx electron-builder --linux AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  # 打 tag 时才创建 Release 草稿；手动触发时跳过
  release:
    name: 创建 Release 草稿
    needs: [build-win, build-mac, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 汇总所有平台产物
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' \) -exec mv -t release {} +
          ls -lh release
      - name: 创建草稿 Release 并上传产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --draft \
            --title "兔兔 ${{ github.ref_name }}" \
            --generate-notes \
            release/*

name: Build

# 触发方式：
#   1. 推送 v 开头的 tag（如 v1.0.0）—— 构建并生成 Release 草稿
#   2. 在 Actions 页面手动触发（workflow_dispatch）—— 只构建，产物存为 Artifact
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    name: Windows 便携版
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # --publish never：tag 触发时 electron-builder 默认会自动发布，没有 GH_TOKEN 会直接报错；
      # 本项目的发布统一由最后的 release 作业完成，这里只负责构建
      - name: 构建 Windows 便携版 exe
        run: npx electron-builder --win portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist/*.exe
          if-no-files-found: error

  build-mac:
    name: macOS dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: 构建 macOS dmg + zip（x64 与 arm64）
        shell: bash
        run: npx electron-builder --mac --x64 --arm64 --publish never 2>&1 | tee build.log
      - name: 失败时输出错误摘要
        if: failure()
        shell: bash
        run: |
          echo "----- build.log 末尾 60 行 -----"
          tail -n 60 build.log
          msg=$(tail -n 60 build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          printf '::error::%s\n' "$msg"
      - name: 上传构建日志（无论成败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-mac
          path: build.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: macos-zip
          path: dist/*.zip
          if-no-files-found: error

  build-linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: 构建 Linux AppImage
        shell: bash
        run: npx electron-builder --linux AppImage --publish never 2>&1 | tee build.log
      - name: 失败时输出错误摘要
        if: failure()
        shell: bash
        run: |
          echo "----- build.log 末尾 60 行 -----"
          tail -n 60 build.log
          msg=$(tail -n 60 build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          printf '::error::%s\n' "$msg"
      - name: 上传构建日志（无论成败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-linux
          path: build.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  # 打 tag 时才创建 Release 草稿；手动触发时跳过
  release:
    name: 创建 Release 草稿
    needs: [build-win, build-mac, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 汇总所有平台产物
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' \) -exec mv -t release {} +
          ls -lh release
      - name: 创建草稿 Release 并上传产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --draft \
            --title "兔兔 ${{ github.ref_name }}" \
            --generate-notes \
            release/*
